name: Build Mobile Apps (Google Play & iOS App Store)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundle (.aab & .apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Copy Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          touch android/app/src/main/assets/public/cordova.js android/app/src/main/assets/public/cordova_plugins.js

      - name: Build Android APK & Release Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS Xcode Project
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Copy Assets to iOS
        run: |
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          cp capacitor.config.json ios/App/App/capacitor.config.json
          touch ios/App/App/public/cordova.js ios/App/App/public/cordova_plugins.js

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -destination generic/platform=iOS clean build CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build
          path: ios/App
