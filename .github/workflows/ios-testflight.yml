name: Deploy iOS App to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number'
        required: false
        default: '1'

jobs:
  build-and-upload:
    name: Build & Upload to App Store TestFlight
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Copy Assets to iOS
        run: |
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          cp capacitor.config.json ios/App/App/capacitor.config.json
          touch ios/App/App/public/cordova.js ios/App/App/public/cordova_plugins.js

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Run Fastlane Beta (Auto Sign & Upload)
        working-directory: ios/App
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_BASE64: ${{ secrets.APP_STORE_API_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          gem install fastlane
          fastlane ios beta
